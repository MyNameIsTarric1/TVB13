	//=============================================== SELEZIONO LA CANZONE DEL GIORNO CORRENTE =============================================
	
	var currentDate = new Date();

	// var day= 2;

	var audio = document.getElementById("daMod");

	audio.parentNode.load();

	var foto = document.getElementById("fotoDaMod");

	btn_down.download="foto del giorno";

	const fraseCanzone = document.getElementById('frase');

	//PERFETTO FUNZIONA !



let progress = document.getElementById('progress');
let song = document.getElementById('song');
let ctrl = document.getElementById('ctrl');
	

song.onloadedmetadata=function() {
	progress.max = song.duration;
	progress.value = song.currentTime;
}

function playPause() {
	if(ctrl.classList.contains("fa-pause")){
		song.pause();
		ctrl.classList.remove("fa-pause");
		ctrl.classList.add("fa-play");
	}
	else{
		song.play();
		ctrl.classList.add("fa-pause");
		ctrl.classList.remove("fa-play");
	} 

}
if(song.play()){
	setInterval(()=>{
		progress.value = song.currentTime;
	},500);
}

progress.onchange = function(){
	song.play();
	song.currentTime = progress.value
	ctrl.classList.add("fa-pause");
	ctrl.classList.remove("fa-play");
}


function switchMode(){
	let container = document.getElementById("cont");
	let frase = document.getElementById("frase");
	let autoreCanzone = document.getElementById("autore-canzone");
	let titoloCanzone = document.getElementById("titolo-canzone");
	let icon = document.getElementById("switch-icon");

	if(icon.classList.contains("fa-moon")){
		icon.classList.remove("fa-moon");
		icon.classList.add("fa-sun");
		container.style.backgroundColor = "rgb(125, 66, 19)";
		frase.style.color="white";
		autoreCanzone.style.color="white";
		titoloCanzone.style.color="white";

	}else{
		icon.classList.add("fa-moon");
		icon.classList.remove("fa-sun");
		container.style.backgroundColor = "rgb(254, 198, 151)";
		frase.style.color="black";
		autoreCanzone.style.color="black";
		titoloCanzone.style.color="black";
	}

	
}
